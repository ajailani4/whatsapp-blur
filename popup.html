<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; cursor: pointer; }
  .master { font-weight: 600; border-bottom: 1px solid #8884; padding-bottom: 10px; margin-bottom: 4px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #25d366; }
  .hint { font-size: 12px; opacity: .65; margin-top: 10px; }
</style>
</head>
<body>
  <h1>WhatsApp Blur</h1>
  <label class="master">Blur enabled <input type="checkbox" data-key="enabled"></label>
  <label>Messages in chat <input type="checkbox" data-key="messages"></label>
  <label>Chat list previews <input type="checkbox" data-key="previews"></label>
  <label>Contact names <input type="checkbox" data-key="names"></label>
  <label>Profile photos <input type="checkbox" data-key="avatars"></label>
  <label>Message input box <input type="checkbox" data-key="compose"></label>
  <label>Reveal on hover <input type="checkbox" data-key="hover"></label>
  <script src="popup.js"></script>
</body>
</html>
